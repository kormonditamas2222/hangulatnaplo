<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary entries</title>
</head>

<body>
    <nav class="navbar navbar-expand-sm bg-light navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Mood Diary</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">New entry</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="notes.html">See entries</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="stats.html">Statistics</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row">
            <div class="col-sm-12">
                <h1>Mood diary</h1>
                <form id="diary">
                    <label for="mood" class="form-label">Mood</label>
                    <select name="mood" id="mood" class="form-select">
                        <option value="😀">😀</option>
                        <option value="😐">😐</option>
                        <option value="😢">😢</option>
                        <option value="😴">😴</option>
                        <option value="😡">😡</option>
                    </select>
                    <label for="entry" class="form-label">Diary entry</label>
                    <input type="text" value="Text here... " name="entry" id="entry" class="form-control mb-3">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" name="date" id="date" class="form-control">
                    <button type="submit" class="btn btn-primary" id="submit">Submit & Save</button>
                    <button class="btn btn-warning" id="change" hidden>Change</button>
                </form>
            </div>
        </div>
        <div class="row">
            <table class="table table-hover" id="diaryTable">
                <thead>
                    <th>Mood</th>
                    <th>Description</th>
                    <th>Date</th>
                </thead>

            </table>
        </div>
    </div>
    <script type="module" src="/src/notes.ts"></script>
</body>

</html>
